<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>My Dashboard — Roamly</title>
  <meta name="description" content="Your Roamly visitor dashboard — reviews, wishlist, and spot submissions." />
  <style>
    .dash-shell  { min-height: 100vh; background: var(--bg); }
    .dash-topbar {
      background: var(--navy-900);
      padding: 16px 28px;
      display: flex; align-items: center; gap: 16px;
    }
    .dash-topbar-logo { font-family: var(--font-display); color: #fff; font-size: 1.5rem; text-decoration: none; }
    .dash-topbar-logo span { color: var(--red); }
    .dash-user { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .dash-user-name { color: rgba(255,255,255,0.75); font-size: 0.88rem; font-weight: 600; }
    .dash-sign-out { padding: 7px 16px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.3); color: #fff; font-size: 0.82rem; font-weight: 700; cursor: pointer; background: none; font-family: inherit; transition: 0.15s; }
    .dash-sign-out:hover { background: rgba(255,255,255,0.1); }

    /* Tabs */
    .dash-tabs { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; padding: 0 28px; }
    .dash-tab { padding: 16px 20px; font-size: 0.9rem; font-weight: 700; color: var(--ink-soft); border: none; background: none; cursor: pointer; font-family: inherit; border-bottom: 3px solid transparent; transition: 0.15s; }
    .dash-tab:hover  { color: var(--ink); }
    .dash-tab.active { color: var(--ink); border-bottom-color: var(--red); }

    .dash-body { max-width: 1100px; margin: 0 auto; padding: 40px 28px; }
    .dash-section { display: none; }
    .dash-section.active { display: block; }
    .dash-section h2 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 24px; color: var(--ink); }

    /* Review cards */
    .rev-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .rev-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .rev-card-type { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; background: rgba(215,38,61,0.1); color: var(--red); }
    .rev-stars { color: #f59e0b; font-size: 0.95rem; }
    .rev-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-sm { padding: 5px 14px; border-radius: var(--radius-sm); font-size: 0.78rem; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: 0.15s; }
    .btn-sm-danger  { background: rgba(215,38,61,0.1); color: var(--red); border: 1px solid rgba(215,38,61,0.25); }
    .btn-sm-danger:hover { background: var(--red); color: #fff; }
    .btn-sm-neutral { background: var(--bg); color: var(--ink-soft); border: 1px solid var(--line); }
    .btn-sm-neutral:hover { background: var(--line); }

    /* Wishlist */
    .wish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .wish-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; box-shadow: var(--shadow-sm); display: flex; gap: 14px; align-items: flex-start; }
    .wish-thumb { width: 60px; height: 60px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; background: var(--bg); }
    .wish-info  { flex: 1; min-width: 0; }
    .wish-info h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wish-info p  { font-size: 0.78rem; color: var(--ink-faint); }
    .wish-remove { font-size: 0.75rem; font-weight: 700; color: var(--red); background: none; border: none; cursor: pointer; font-family: inherit; margin-top: 6px; padding: 0; }

    /* Spots */
    .spot-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .spot-row h4 { font-size: 0.95rem; font-weight: 700; flex: 1; min-width: 140px; }
    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .status-pending  { background: rgba(245,158,11,0.15); color: #b45309; }
    .status-approved { background: rgba(16,185,129,0.15); color: #047857; }
    .status-rejected { background: rgba(215,38,61,0.12); color: var(--red); }
    .rejection-reason { font-size: 0.82rem; color: var(--red); margin-top: 4px; font-style: italic; }

    /* Edit review inline */
    .edit-form { margin-top: 12px; display: none; }
    .edit-form textarea { width: 100%; min-height: 70px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-family: inherit; font-size: 0.88rem; resize: vertical; color: var(--ink); background: var(--bg); }
    .edit-stars { display: flex; gap: 4px; margin-bottom: 6px; }
    .edit-star { font-size: 1.2rem; cursor: pointer; background: none; border: none; color: #d1d5db; }
    .edit-star.lit { color: #f59e0b; }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--ink-faint); font-size: 0.95rem; }
    .empty-state svg { width: 48px; height: 48px; display: block; margin: 0 auto 12px; opacity: 0.3; }
  </style>
</head>
<body class="dash-shell">

<div class="dash-topbar">
  <a href="index.html" class="dash-topbar-logo">Roam<span>ly</span></a>
  <div class="dash-user">
    <span class="dash-user-name" id="userName">Visitor</span>
    <button class="dash-sign-out" id="signOutBtn">Sign Out</button>
  </div>
</div>

<div class="dash-tabs" role="tablist">
  <button class="dash-tab active" data-tab="reviews" role="tab">⭐ My Reviews</button>
  <button class="dash-tab" data-tab="wishlist" role="tab">❤ Wishlist</button>
  <button class="dash-tab" data-tab="spots" role="tab">📍 My Spot Submissions</button>
</div>

<div class="dash-body">

  <!-- ── Reviews ── -->
  <div class="dash-section active" id="section-reviews">
    <h2>My Reviews</h2>
    <div id="reviewList"><p style="color:var(--ink-faint)">Loading…</p></div>
  </div>

  <!-- ── Wishlist ── -->
  <div class="dash-section" id="section-wishlist">
    <h2>My Wishlist</h2>
    <div class="wish-grid" id="wishGrid"><p style="color:var(--ink-faint)">Loading…</p></div>
  </div>

  <!-- ── Spots ── -->
  <div class="dash-section" id="section-spots">
    <h2>My Spot Submissions</h2>
    <div id="spotList"><p style="color:var(--ink-faint)">Loading…</p></div>
  </div>

</div>

<script src="script.js"></script>
<script>
// ── Auth guard ─────────────────────────────────────────────────────────────────
const user = JSON.parse(localStorage.getItem('roamlyUser') || 'null');
if (!user || !user.token || user.role !== 'visitor') {
  window.location.href = 'auth.html';
}
const TOKEN = user.token;
document.getElementById('userName').textContent = user.name || 'Visitor';
document.getElementById('signOutBtn').addEventListener('click', () => {
  localStorage.removeItem('roamlyUser');
  localStorage.removeItem('roamly_token');
  localStorage.removeItem('roamly_role');
  window.location.href = 'auth.html';
});

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function starsStr(n) { return '★'.repeat(n)+'☆'.repeat(5-n); }

// ── Tabs ──────────────────────────────────────────────────────────────────────
const TABS    = ['reviews', 'wishlist', 'spots'];
const LOADERS = { reviews: loadReviews, wishlist: loadWishlist, spots: loadSpots };
document.querySelectorAll('.dash-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    TABS.forEach(t => {
      document.getElementById('section-' + t).classList.toggle('active', t === btn.dataset.tab);
      document.querySelector(`.dash-tab[data-tab="${t}"]`).classList.toggle('active', t === btn.dataset.tab);
    });
    LOADERS[btn.dataset.tab]?.();
  });
});

async function apiFetch(path, opts = {}) {
  const res = await fetch('/api' + path, { headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json', ...opts.headers }, ...opts });
  return res.json();
}

// ── My Reviews ────────────────────────────────────────────────────────────────
async function loadReviews() {
  const body = await apiFetch('/reviews/mine');
  const el   = document.getElementById('reviewList');
  if (!body.success || !body.data.length) {
    el.innerHTML = '<div class="empty-state"><p>No reviews yet. Explore destinations and leave your first one!</p></div>'; return;
  }
  el.innerHTML = body.data.map(r => `
    <div class="rev-card" id="rev-${r._id}">
      <div class="rev-card-head">
        <div>
          <span class="rev-card-type">${esc(r.targetType)}</span>
          <span class="rev-stars" style="margin-left:8px">${starsStr(r.rating)}</span>
        </div>
        <small style="color:var(--ink-faint)">${new Date(r.createdAt).toLocaleDateString('en-GB')}</small>
      </div>
      <p style="color:var(--ink-soft);font-size:0.9rem;line-height:1.5">${esc(r.comment || '(no comment)')}</p>
      <div class="rev-actions">
        <button class="btn-sm btn-sm-neutral" onclick="toggleEdit('${r._id}','${r.rating}')">Edit</button>
        <button class="btn-sm btn-sm-danger"  onclick="deleteReview('${r._id}')">Delete</button>
      </div>
      <div class="edit-form" id="edit-${r._id}">
        <div class="edit-stars" id="estars-${r._id}"></div>
        <textarea id="etext-${r._id}" placeholder="Update your comment…">${esc(r.comment||'')}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-sm btn-sm-neutral" onclick="document.getElementById('edit-${r._id}').style.display='none'">Cancel</button>
          <button class="btn-sm" style="background:var(--navy-700);color:#fff" onclick="saveEdit('${r._id}')">Save</button>
        </div>
      </div>
    </div>`).join('');

  // Build edit star widgets
  body.data.forEach(r => {
    let sel = r.rating;
    const row = document.getElementById('estars-' + r._id);
    if (!row) return;
    for (let i = 1; i <= 5; i++) {
      const s = document.createElement('button');
      s.className = 'edit-star' + (i <= sel ? ' lit' : '');
      s.textContent = '★'; s.dataset.val = i;
      s.addEventListener('click', () => {
        sel = i;
        row.querySelectorAll('.edit-star').forEach(b => b.classList.toggle('lit', Number(b.dataset.val) <= i));
        row.dataset.rating = i;
      });
      row.appendChild(s);
    }
    row.dataset.rating = sel;
  });
}

function toggleEdit(id, rating) {
  const form = document.getElementById('edit-' + id);
  form.style.display = form.style.display === 'none' || form.style.display === '' ? 'block' : 'none';
}

async function saveEdit(id) {
  const ratingEl = document.getElementById('estars-' + id);
  const rating   = Number(ratingEl.dataset.rating || 1);
  const comment  = document.getElementById('etext-' + id).value.trim();
  const body     = await apiFetch('/reviews/' + id, { method: 'PUT', body: JSON.stringify({ rating, comment }) });
  if (body.success) loadReviews();
  else alert(body.message || 'Failed to update');
}

async function deleteReview(id) {
  if (!confirm('Delete this review?')) return;
  const body = await apiFetch('/reviews/' + id, { method: 'DELETE' });
  if (body.success) loadReviews();
  else alert(body.message || 'Failed to delete');
}

// ── Wishlist ──────────────────────────────────────────────────────────────────
async function loadWishlist() {
  const body = await apiFetch('/wishlist/mine');
  const grid = document.getElementById('wishGrid');
  if (!body.success || !body.data.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>Your wishlist is empty. Heart a destination or business to save it here.</p></div>'; return;
  }
  grid.innerHTML = body.data.map(e => {
    const item = e.item;
    const link = e.itemType === 'business' ? `business-detail.html?id=${esc(e.itemId)}` : `destination-detail.html?id=${esc(e.itemId)}`;
    return `
      <div class="wish-card">
        <img class="wish-thumb" src="${item?.photo ? esc(item.photo) : 'https://picsum.photos/seed/' + esc(e.itemId) + '/60/60'}" alt="${esc(item?.name||'')}" onerror="this.src='https://picsum.photos/60/60'" />
        <div class="wish-info">
          <h4><a href="${link}" style="color:var(--ink);text-decoration:none">${esc(item?.name || 'Unknown')}</a></h4>
          <p>${esc(e.itemType)}</p>
          <button class="wish-remove" onclick="removeWish('${esc(e.itemType)}','${esc(e.itemId)}')">✕ Remove</button>
        </div>
      </div>`;
  }).join('');
}

async function removeWish(itemType, itemId) {
  const body = await apiFetch('/wishlist', { method: 'POST', body: JSON.stringify({ itemType, itemId }) });
  if (body.success) loadWishlist();
}

// ── Spot Submissions ──────────────────────────────────────────────────────────
async function loadSpots() {
  const body = await apiFetch('/users/me/dashboard');
  const el   = document.getElementById('spotList');
  const subs = body.data?.spotSubmissions || [];
  if (!subs.length) {
    el.innerHTML = '<div class="empty-state"><p>No tourist spot submissions yet.</p></div>'; return;
  }
  el.innerHTML = subs.map(s => `
    <div class="spot-row">
      <div style="flex:1;min-width:0">
        <h4>${esc(s.name)}</h4>
        <p style="font-size:0.82rem;color:var(--ink-faint)">${esc(s.category)} · ${esc(s.destination?.name||'')}</p>
        ${s.status === 'rejected' && s.rejectionReason ? `<p class="rejection-reason">Rejected: ${esc(s.rejectionReason)}</p>` : ''}
      </div>
      <span class="status-badge status-${esc(s.status)}">${esc(s.status)}</span>
      ${s.status === 'rejected' ? `<button class="btn-sm btn-sm-neutral" onclick="resubmit('${esc(s._id)}','${esc(s.name)}')">Resubmit</button>` : ''}
    </div>`).join('');
}

async function resubmit(id, name) {
  const note = prompt(`Resubmit spot "${name}" — add a note for the admin (optional):`);
  if (note === null) return; // cancelled
  const body = await apiFetch('/spots/' + id, { method: 'PUT', body: JSON.stringify({ resubmissionNote: note }) });
  if (body.success) { alert('Spot resubmitted!'); loadSpots(); }
  else alert(body.message || 'Failed to resubmit.');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadReviews();
</script>
</body>
</html>
