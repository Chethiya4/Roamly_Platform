<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <title>Roamly — Business Dashboard</title>
  <style>
    .dashboard-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .status-banner {
      padding: 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
      font-weight: 600;
      text-align: center;
    }

    .status-approved {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .status-pending {
      background: #fff3e0;
      color: #ef6c00;
      border: 1px solid #ffcc80;
    }

    .status-rejected {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--line);
      text-align: center;
    }

    .stat-card h3 {
      font-size: 2rem;
      color: var(--red);
      margin-bottom: 8px;
      font-family: var(--font-display);
    }

    .stat-card p {
      color: var(--ink-soft);
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .section-box {
      background: var(--surface);
      padding: 32px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--line);
      margin-bottom: 40px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
    }

    .form-input:disabled {
      background: #f5f5f5;
      color: #999;
      border-color: #eee;
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .listing-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .listing-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .listing-content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .listing-title {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .listing-price {
      color: var(--red);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .listing-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 0.9rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-small:hover {
      background: var(--bg);
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <a href="business.html" class="logo"><img src="assets/logo.png" alt="Brand logo"></a>
      <div class="header-actions">
        <button type="button" class="btn-signin"
          style="background: transparent; color: var(--ink); border-color: var(--line);" id="logoutBtn">Log Out</button>
      </div>
    </div>
  </header>

  <main style="background: var(--bg); min-height: 80vh; padding-top: 20px;">
    <div class="dashboard-container">
      <div id="statusBanner" class="status-banner" style="display:none;"></div>

      <div class="stats-row">
        <div class="stat-card">
          <h3 id="statTotalListings">-</h3>
          <p>Total Listings</p>
        </div>
        <div class="stat-card">
          <h3 id="statActiveListings">-</h3>
          <p>Active Listings</p>
        </div>
        <div class="stat-card">
          <h3 id="statAvgRating">-</h3>
          <p>Avg Rating</p>
        </div>
        <div class="stat-card">
          <h3 id="statTotalReviews">-</h3>
          <p>Total Reviews</p>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">
          Business Profile
          <button id="editProfileBtn" class="btn-primary"
            style="padding: 8px 16px; font-size: 0.9rem; border-radius: 999px;">Edit</button>
        </div>
        <form id="profileForm">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group"><label>Business Name</label><input type="text" id="profName" name="name"
                class="form-input" disabled></div>
            <div class="form-group"><label>Category</label><input type="text" id="profCategory" name="category"
                class="form-input" disabled></div>
            <div class="form-group"><label>Business Phone</label><input type="text" id="profPhone"
                name="contact.businessPhone" class="form-input" disabled></div>
            <div class="form-group"><label>Business Email</label><input type="email" id="profEmail"
                name="contact.businessEmail" class="form-input" disabled></div>
            <div class="form-group" style="grid-column: 1 / -1;"><label>Description</label><textarea id="profDesc"
                name="description" class="form-input" rows="3" disabled></textarea></div>
          </div>
          <button type="submit" id="saveProfileBtn" class="btn-primary"
            style="display:none; margin-top: 16px; padding: 12px 24px; border-radius: 999px;">Save Changes</button>
        </form>
      </div>

      <div class="section-box">
        <div class="section-title">
          My Listings
          <button id="addListingBtn" class="btn-primary"
            style="padding: 8px 16px; font-size: 0.9rem; border-radius: 999px;">+ Add Listing</button>
        </div>
        <div id="listingsGrid" class="listings-grid"></div>
      </div>
    </div>
  </main>

  <!-- Add Listing Modal -->
  <div id="listingModal" class="modal-overlay"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center;">
    <div class="modal-content"
      style="background:var(--surface); padding:30px; border-radius:var(--radius-lg); max-width:500px; width:100%; box-shadow:var(--shadow-lg);">
      <h3 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 20px;">Add New Listing</h3>
      <div id="listingModalError" style="color: #c62828; margin-bottom: 10px; display: none; font-weight:600;"></div>
      <form id="listingForm">
        <div class="form-group"><label>Title</label><input type="text" id="listTitle" name="title" class="form-input"
            required></div>
        <div class="form-group"><label>Description</label><textarea id="listDesc" name="description" class="form-input"
            rows="3" required></textarea></div>
        <div class="form-group"><label>Price (LKR)</label><input type="number" id="listPrice" name="price"
            class="form-input" required></div>

        <div class="form-group"><label>Category</label><input type="text" id="listCategory" name="category"
            class="form-input" placeholder="e.g. Room, Service, Food" required></div>

        <div class="form-group"><label>Thumbnail Image</label><input type="file" id="listImage" name="images"
            class="form-input" accept="image/*" required></div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top: 20px;">
          <button type="button" id="closeListingModal" class="btn-small">Cancel</button>
          <button type="submit" class="btn-primary" style="padding: 8px 20px; border-radius: 999px;">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Listing Modal -->
  <div id="editListingModal" class="modal-overlay"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center;">
    <div class="modal-content"
      style="background:var(--surface); padding:30px; border-radius:var(--radius-lg); max-width:500px; width:100%; box-shadow:var(--shadow-lg);">
      <h3 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 20px;">Edit Listing</h3>
      <div id="editListingModalError" style="color: #c62828; margin-bottom: 10px; display: none; font-weight:600;">
      </div>
      <form id="editListingForm">
        <input type="hidden" id="editListId">
        <div class="form-group"><label>Title</label><input type="text" id="editListTitle" name="title"
            class="form-input" required></div>
        <div class="form-group"><label>Description</label><textarea id="editListDesc" name="description"
            class="form-input" rows="3" required></textarea></div>
        <div class="form-group"><label>Price (LKR)</label><input type="number" id="editListPrice" name="price"
            class="form-input" required></div>
        <div class="form-group"><label>Category</label><input type="text" id="editListCategory" name="category"
            class="form-input" required></div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top: 20px;">
          <button type="button" id="closeEditListingModal" class="btn-small">Cancel</button>
          <button type="submit" class="btn-primary" style="padding: 8px 20px; border-radius: 999px;">Update</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const token = localStorage.getItem('roamly_token');
    if (!token) window.location.href = 'auth.html';

    async function authFetch(url, options = {}) {
      options.headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
      const res = await fetch(url, options);
      if (res.status === 401) {
        localStorage.removeItem('roamly_token');
        window.location.href = 'auth.html';
      }
      return res;
    }

    let businessData = null;
    let allListings = [];

    async function initDashboard() {
      try {
        const [bizRes, statsRes, listsRes] = await Promise.all([
          authFetch('/api/business/me'),
          authFetch('/api/business/me/stats'),
          authFetch('/api/listings/mine')
        ]);

        const bizJson = await bizRes.json();
        if (bizJson.success) {
          businessData = bizJson.data;
          renderBanner(bizJson.data);
          renderProfile(bizJson.data);
        }

        const statsJson = await statsRes.json();
        if (statsJson.success) {
          renderStats(statsJson.data);
        }

        const listsJson = await listsRes.json();
        if (listsJson.success) {
          allListings = listsJson.data;
          renderListings(listsJson.data);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderBanner(biz) {
      const banner = document.getElementById('statusBanner');
      banner.style.display = 'block';
      if (biz.status === 'approved') {
        banner.className = 'status-banner status-approved';
        banner.textContent = 'Approved ✓';
      } else if (biz.status === 'pending') {
        banner.className = 'status-banner status-pending';
        banner.textContent = 'Pending Admin Review';
      } else {
        banner.className = 'status-banner status-rejected';
        banner.textContent = `Rejected — ${biz.rejectionReason || 'Please review your details.'} (Edit profile and save to resubmit)`;
      }
    }

    function renderStats(stats) {
      document.getElementById('statTotalListings').textContent = stats.totalListings || 0;
      document.getElementById('statActiveListings').textContent = stats.activeListings || 0;
      document.getElementById('statAvgRating').textContent = stats.averageRating || 0;
      document.getElementById('statTotalReviews').textContent = stats.totalReviews || 0;
    }

    function renderProfile(biz) {
      document.getElementById('profName').value = biz.name || '';
      document.getElementById('profCategory').value = biz.category || '';
      document.getElementById('profPhone').value = (biz.contact && biz.contact.businessPhone) || '';
      document.getElementById('profEmail').value = (biz.contact && biz.contact.businessEmail) || '';
      document.getElementById('profDesc').value = biz.description || '';
    }

    const profileForm = document.getElementById('profileForm');
    const editBtn = document.getElementById('editProfileBtn');
    const saveBtn = document.getElementById('saveProfileBtn');
    const inputs = profileForm.querySelectorAll('input, textarea');

    editBtn.addEventListener('click', () => {
      inputs.forEach(i => i.disabled = false);
      editBtn.style.display = 'none';
      saveBtn.style.display = 'inline-block';
    });

    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('profName').value,
        category: document.getElementById('profCategory').value,
        description: document.getElementById('profDesc').value,
        'contact.businessPhone': document.getElementById('profPhone').value,
        'contact.businessEmail': document.getElementById('profEmail').value,
      };

      try {
        const res = await authFetch('/api/business/me', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          inputs.forEach(i => i.disabled = true);
          saveBtn.style.display = 'none';
          editBtn.style.display = 'inline-block';
          initDashboard(); // re-fetch to update banner if status changed
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Error updating profile');
      }
    });

    function renderListings(listings) {
      const grid = document.getElementById('listingsGrid');
      grid.innerHTML = '';
      if (listings.length === 0) {
        grid.innerHTML = '<p style="color:var(--ink-soft);">No listings found.</p>';
        return;
      }
      listings.forEach(list => {
        const div = document.createElement('div');
        div.className = 'listing-card';
        const imgUrl = list.images && list.images[0] ? list.images[0] : 'assets/placeholder.jpg';
        div.innerHTML = `
          <img src="${imgUrl}" class="listing-img">
          <div class="listing-content">
            <div class="listing-title">${list.title}</div>
            <div class="listing-price">LKR ${list.price}</div>
            <div class="listing-actions">
              <button class="btn-small edit-btn" data-id="${list._id}">Edit</button>
              <button class="btn-small del-btn" data-id="${list._id}">Delete</button>
            </div>
          </div>
        `;
        grid.appendChild(div);
      });

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const listingId = e.target.dataset.id;
          const listing = allListings.find(l => l._id === listingId);
          if (listing) {
            document.getElementById('editListId').value = listing._id;
            document.getElementById('editListTitle').value = listing.title;
            document.getElementById('editListDesc').value = listing.description;
            document.getElementById('editListPrice').value = listing.price;
            document.getElementById('editListCategory').value = listing.category || '';
            document.getElementById('editListingModal').style.display = 'flex';
          }
        });
      });

      document.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (confirm('Are you sure you want to delete this listing?')) {
            await authFetch(`/api/listings/${e.target.dataset.id}`, { method: 'DELETE' });
            initDashboard();
          }
        });
      });
    }

    const modal = document.getElementById('listingModal');
    document.getElementById('addListingBtn').addEventListener('click', () => {
      if (businessData && businessData.status !== 'approved') {
        alert('Your business must be approved before adding listings.');
        return;
      }
      modal.style.display = 'flex';
    });

    document.getElementById('closeListingModal').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    document.getElementById('closeEditListingModal').addEventListener('click', () => {
      document.getElementById('editListingModal').style.display = 'none';
    });

    document.getElementById('listingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('listingModalError');
      errBox.style.display = 'none';

      const formData = new FormData();
      formData.append('title', document.getElementById('listTitle').value);
      formData.append('description', document.getElementById('listDesc').value);
      formData.append('price', document.getElementById('listPrice').value);
      formData.append('category', document.getElementById('listCategory').value);
      formData.append('business', businessData._id); // Provide business ID just in case

      const fileInput = document.getElementById('listImage');
      if (fileInput.files.length > 0) {
        // listingsController might expect 'images' array or multiple
        for (let i = 0; i < fileInput.files.length; i++) {
          formData.append('images', fileInput.files[i]);
        }
      }

      try {
        const res = await authFetch('/api/listings', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          modal.style.display = 'none';
          document.getElementById('listingForm').reset();
          initDashboard();
        } else {
          errBox.textContent = data.message;
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Error adding listing';
        errBox.style.display = 'block';
      }
    });

    document.getElementById('editListingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('editListingModalError');
      errBox.style.display = 'none';

      const id = document.getElementById('editListId').value;
      const body = {
        title: document.getElementById('editListTitle').value,
        description: document.getElementById('editListDesc').value,
        price: document.getElementById('editListPrice').value,
        category: document.getElementById('editListCategory').value
      };

      try {
        const res = await authFetch(`/api/listings/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('editListingModal').style.display = 'none';
          initDashboard();
        } else {
          errBox.textContent = data.message;
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Error updating listing';
        errBox.style.display = 'block';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('roamly_token');
      window.location.href = 'business.html';
    });

    initDashboard();
  </script>
</body>

</html>
