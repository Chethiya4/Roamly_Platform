<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="google" content="notranslate">

  <link rel="icon" type="image/png" href="assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">

  <title>Roamly — My Wishlist</title>
</head>


<body class="wishlist-page">

  <!-- =========================
       HEADER
       ========================= -->

  <header class="header">

    <div class="header-inner">

      <!-- Logo -->
      <a href="index.html" class="logo">
        <img
          src="assets/logo.png"
          alt="Brand logo"
        >
      </a>


      <div class="header-actions">

        <!-- Language Selector -->

        <div class="lang-select">

          <button
            type="button"
            class="lang-trigger"
            id="langTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
          >

            <span id="langCode">EN</span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M6 9l6 6 6-6"/>
            </svg>

          </button>


          <ul
            class="lang-menu"
            id="langMenu"
            role="listbox"
            hidden
          >

            <li>
              <button
                type="button"
                class="active"
                data-code="EN"
              >
                English
              </button>
            </li>

            <li>
              <button
                type="button"
                data-code="SI"
              >
                සිංහල (Sinhala)
              </button>
            </li>

            <li>
              <button
                type="button"
                data-code="TA"
              >
                தமிழ் (Tamil)
              </button>
            </li>

            <li>
              <button
                type="button"
                data-code="ZH"
              >
                中文 (Chinese)
              </button>
            </li>

            <li>
              <button
                type="button"
                data-code="DE"
              >
                Deutsch (German)
              </button>
            </li>

          </ul>

        </div>


        <!-- Currency Selector -->

        <div
          class="currency-select"
          role="group"
          aria-label="Currency"
          id="currencySelect"
        >

          <button
            type="button"
            class="active"
            data-currency="LKR"
          >
            LKR
          </button>

          <button
            type="button"
            data-currency="USD"
          >
            USD
          </button>

          <button
            type="button"
            data-currency="EUR"
          >
            EUR
          </button>

        </div>


        <!-- Sign In -->

        <button
          type="button"
          class="btn-signin"
          data-i18n="signIn"
        >
          Sign In
        </button>


        <!-- Wishlist -->

        <button
          type="button"
          class="icon-btn"
          aria-label="Wishlist"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <path
              d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"
            />

          </svg>

          <span class="badge">0</span>

        </button>


        <!-- Dark Mode -->

        <button
          type="button"
          class="icon-btn"
          id="darkModeToggle"
          aria-label="Toggle dark mode"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <circle
              cx="12"
              cy="12"
              r="4.5"
            />

            <path
              d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
            />

          </svg>

        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       MAIN CONTENT
       ========================= -->

  <main>

    <section class="section-padding">

      <div class="container">

        <div class="wishlist-page-heading">

          <h1>My Wishlist</h1>

          <p>
            Your saved travel destinations in Sri Lanka.
          </p>

        </div>


        <!-- Wishlist cards inserted by wishlist-page.js -->

        <div
          id="wishlistPageGrid"
          class="wishlist-page-grid"
        >
        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       SCRIPTS
       ========================= -->

  <script src="translations.js"></script>

  <script src="script.js"></script>

  <script src="wishlist-page.js"></script>

</body>

</html>
